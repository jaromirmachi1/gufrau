<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GUFRAU — contact</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #fff;
        color: #0b1f7a;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .gufrau-contact {
        --gufrau-contact-text: #0b1f7a;
        position: relative;
        min-height: 100dvh;
        background: #fff;
        color: var(--gufrau-contact-text);
        overflow: hidden;
      }
      .gufrau-contact__home {
        position: absolute;
        top: clamp(1rem, 3vw, 1.75rem);
        left: clamp(1rem, 3vw, 1.75rem);
        z-index: 3;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: lowercase;
        text-decoration: none;
        color: inherit;
      }
      .gufrau-contact__content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: clamp(1.75rem, 4vh, 2.75rem);
        padding: clamp(5rem, 14vh, 8rem) clamp(1.25rem, 5vw, 3.5rem) 28vh;
        max-width: 40rem;
      }
      .gufrau-contact__block {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }
      .gufrau-contact__label {
        margin: 0;
        font-size: clamp(1.35rem, 2.8vw, 1.85rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }
      .gufrau-contact__email {
        color: inherit;
        text-decoration: none;
        font-size: clamp(1.05rem, 2.2vw, 1.4rem);
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .gufrau-contact__logo {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1;
        width: 100%;
        line-height: 0;
        pointer-events: none;
      }
      .gufrau-contact__logo-img {
    transform: translateY(10%);
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <section class="gufrau-contact">
      <a class="gufrau-contact__home" href="index.html">home</a>
      <div class="gufrau-contact__content">
        <div class="gufrau-contact__block">
          <h1 class="gufrau-contact__label">Booking</h1>
          <a class="gufrau-contact__email" href="mailto:booking@gufrau.com">booking@gufrau.com</a>
        </div>
        <div class="gufrau-contact__block">
          <h2 class="gufrau-contact__label">Management</h2>
          <a class="gufrau-contact__email" href="mailto:management@gufrau.com">management@gufrau.com</a>
        </div>
      </div>
      <div class="gufrau-contact__logo" aria-hidden="true">
        <img class="gufrau-contact__logo-img" src="../assets/blueorange.png" alt="" width="2902" height="732">
      </div>
    </section>
  </body>
</html>
